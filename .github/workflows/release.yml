name: Release Clutch-CS

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Resolve the merged version
        id: plan
        run: node .github/scripts/release.mjs plan

  windows:
    needs: version
    if: needs.version.outputs.eligible == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}

  test-results:
    name: Report test failures
    needs: windows
    if: needs.windows.outputs.tests_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report unsuccessful validation
        run: |
          echo '::error::Validation stages failed. Review the Windows job summary and test-results artifact. Publishing depends on the build and package results.'
          exit 1

  publish:
    needs: [version, windows]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-windows
          path: artifacts/release
      - name: Publish completed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TEST_RESULTS: ${{ needs.windows.outputs.test_results }}
        run: node .github/scripts/release.mjs publish artifacts/release
