name: Validate Clutch-CS

on:
  workflow_dispatch:
    inputs:
      skip_scripts:
        description: 'リリース規則・スクリプトの試験をスキップ'
        type: boolean
        default: false
      skip_unit:
        description: '通常の単体試験をスキップ'
        type: boolean
        default: false
      unit_filter:
        description: '単体試験の絞り込み（例: FullyQualifiedName~MyTests、空欄は全件）'
        type: string
        default: ''
      skip_client:
        description: 'Clientの通常試験をスキップ'
        type: boolean
        default: false
      skip_installer:
        description: 'Installerの通常試験をスキップ'
        type: boolean
        default: false
      skip_integration:
        description: '通常の結合試験をスキップ'
        type: boolean
        default: false
      integration_filter:
        description: '結合試験の絞り込み（例: FullyQualifiedName~MyTests、空欄は全件）'
        type: string
        default: ''
      skip_performance:
        description: '性能試験をスキップ'
        type: boolean
        default: false
      performance_filter:
        description: '性能試験の絞り込み（例: FullyQualifiedName~MyTests、空欄は全件）'
        type: string
        default: ''
      skip_package:
        description: '配布物の生成・実インストール検証をスキップ'
        type: boolean
        default: false
  workflow_call:
    outputs:
      tests_failed:
        description: 'Whether any validation stage failed'
        value: ${{ jobs.package.outputs.tests_failed || jobs.tests.outputs.tests_failed }}
      test_results:
        description: 'Validation stage outcomes for release notes'
        value: ${{ jobs.package.outputs.test_results || jobs.tests.outputs.test_results }}
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Regression and performance tests (4 vCPU)
    runs-on: ${{ vars.TEST_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 210
    outputs:
      tests_failed: ${{ steps.validation_summary.outputs.tests_failed }}
      test_results: ${{ steps.validation_summary.outputs.test_results }}
    env:
      ContinuousIntegrationBuild: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Windows build tools
        uses: ./.github/actions/prepare-windows
      - name: Record manual validation scope
        if: github.event_name == 'workflow_dispatch'
        env:
          VALIDATION_INPUTS: ${{ toJSON(inputs) }}
        run: |
          $selection = ConvertFrom-Json -InputObject $env:VALIDATION_INPUTS -AsHashtable
          $stages = [ordered]@{
            skip_scripts = 'Release rules and script tests'
            skip_unit = 'Unit tests'
            skip_client = 'Client tests'
            skip_installer = 'Installer regression tests'
            skip_integration = 'Integration tests'
            skip_performance = 'Performance tests'
            skip_package = 'Package build and installation verification'
          }
          $summary = @('', '### Validation scope', '', '| Stage | Selected |', '| --- | --- |', '| Build and analyzers | Run |')
          foreach ($key in $stages.Keys) {
            $selected = 'Run'
            if ($selection[$key]) { $selected = 'Skip' }
            $summary += "| $($stages[$key]) | $selected |"
          }
          if (-not [string]::IsNullOrWhiteSpace($selection.unit_filter)) {
            $summary += @('', 'Unit test filter:', '', '```text', $selection.unit_filter, '```')
          }
          if (-not [string]::IsNullOrWhiteSpace($selection.integration_filter)) {
            $summary += @('', 'Integration test filter:', '', '```text', $selection.integration_filter, '```')
          }
          if (-not [string]::IsNullOrWhiteSpace($selection.performance_filter)) {
            $summary += @('', 'Performance test filter:', '', '```text', $selection.performance_filter, '```')
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Test release and validation rules
        id: release_rules
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_scripts
        run: node --test .github/scripts/*.test.mjs
      - name: Restore and build the release
        run: |
          dotnet restore Clutch-CS.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Clutch-CS.slnx -c Release --no-restore -warnaserror "-p:Version=$env:RELEASE_VERSION"
      - name: Prepare media tools for integration tests
        id: media_tools
        continue-on-error: true
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue) -or -not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $probe = (Get-Command ffprobe -ErrorAction Stop).Source
          $encoder = (Get-Command ffmpeg -ErrorAction Stop).Source
          & $probe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @("CONTENTS_TEST_FFPROBE=$probe", "CONTENTS_TEST_FFMPEG=$encoder") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test versioning, packaging, platform scripts and JavaScript
        id: platform_tests
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_scripts
        run: |
          ./eng/versioning/Test-BuildVersion.ps1
          ./tests/ReArtWord.Contents.BackgroundService.Installer.Tests/Test-SourcePackage.ps1
          # 配布先と同じWindows PowerShellで実行し、NetSecurityは試験用の境界へ差し替える。
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/ReArtWord.Contents.BackgroundService.Installer.Tests/Test-WindowsFirewall.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/ReArtWord.Contents.BackgroundService.Installer.Tests/Test-WindowsUserStartup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test eng/javascript/tests/*.test.mjs eng/css/tests/*.test.mjs tests/ReArtWord.Contents.BackgroundService.Client.Tests/Client/*.test.mjs
      - name: Run unit regression tests
        id: unit_tests
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_unit
        env:
          UNIT_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.unit_filter || '' }}
          CONTENTS_TEST_PRIVATE_CLIPBOARD: '1'
        run: |
          $filter = 'Category!=Performance'
          if (-not [string]::IsNullOrWhiteSpace($env:UNIT_TEST_FILTER)) {
            $filter += "&($env:UNIT_TEST_FILTER)"
          }
          dotnet test tests/ReArtWord.Contents.BackgroundService.Unit.Tests -c Release --no-build --no-restore --filter $filter --settings eng/testing/ci.runsettings --logger trx --logger 'console;verbosity=normal' --results-directory artifacts/TestResults/unit -- xUnit.ParallelizeTestCollections=true RunConfiguration.TreatNoTestsAsError=true
      - name: Run client regression tests
        id: client_tests
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_client
        run: dotnet test tests/ReArtWord.Contents.BackgroundService.Client.Tests -c Release --no-build --no-restore --filter 'Category!=Performance' --settings eng/testing/ci.runsettings --logger trx --logger 'console;verbosity=normal' --results-directory artifacts/TestResults/client -- xUnit.ParallelizeTestCollections=true
      - name: Run installer regression tests
        id: installer_tests
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_installer
        run: dotnet test tests/ReArtWord.Contents.BackgroundService.Installer.Tests -c Release --no-build --no-restore --settings eng/testing/ci.runsettings --logger trx --logger 'console;verbosity=normal' --results-directory artifacts/TestResults/installer
      - name: Publish the Core for process tests
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_integration || !inputs.skip_performance
        run: |
          dotnet publish src/ReArtWord.Contents.BackgroundService.CoreService/ReArtWord.Contents.BackgroundService.CoreService.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -warnaserror "-p:Version=$env:RELEASE_VERSION" -o artifacts/test-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $core = (Resolve-Path artifacts/test-core/Clutch-CS.CoreService.exe).Path
          "CONTENTS_TEST_CORE=$core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run integration regression tests
        id: integration_tests
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_integration
        env:
          INTEGRATION_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.integration_filter || '' }}
        run: |
          $filter = 'Category!=Performance'
          if (-not [string]::IsNullOrWhiteSpace($env:INTEGRATION_TEST_FILTER)) {
            $filter += "&($env:INTEGRATION_TEST_FILTER)"
          }
          dotnet test tests/ReArtWord.Contents.BackgroundService.Integration.Tests -c Release --no-build --no-restore --filter $filter --settings eng/testing/ci.runsettings --logger trx --logger 'console;verbosity=normal' --results-directory artifacts/TestResults/integration -- RunConfiguration.TreatNoTestsAsError=true
      - name: Run isolated performance tests
        id: performance_tests
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_performance
        env:
          PERFORMANCE_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_filter || '' }}
        run: |
          $counterPath = Join-Path $PWD 'artifacts/TestResults/performance-resources.csv'
          [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($counterPath))
          $monitor = Start-Job -ArgumentList $counterPath -ScriptBlock {
            param($path)
            $counters = @(
              '\Processor(_Total)\% Processor Time', '\System\Processor Queue Length',
              '\PhysicalDisk(_Total)\Avg. Disk sec/Read', '\PhysicalDisk(_Total)\Avg. Disk sec/Write',
              '\PhysicalDisk(_Total)\Current Disk Queue Length', '\PhysicalDisk(_Total)\Disk Reads/sec',
              '\PhysicalDisk(_Total)\Disk Writes/sec', '\Memory\Available MBytes'
            )
            Get-Counter -Counter $counters -SampleInterval 1 -Continuous -ErrorAction Stop | ForEach-Object {
              $sample = $_
              $sample.CounterSamples | ForEach-Object {
                [pscustomobject]@{ At = $sample.Timestamp.ToUniversalTime().ToString('O'); Counter = $_.Path; Value = $_.CookedValue }
              }
            } | Export-Csv -LiteralPath $path -NoTypeInformation
          }
          $processPath = Join-Path $PWD 'artifacts/TestResults/performance-processes.csv'
          $processMonitor = Start-Job -ArgumentList $processPath -ScriptBlock {
            param($path)
            $query = 'SELECT Name,IDProcess,ElapsedTime,PercentProcessorTime,PercentPrivilegedTime,IOReadBytesPerSec,IOWriteBytesPerSec FROM Win32_PerfRawData_PerfProc_Process WHERE IDProcess > 0'
            while ($true) {
              $at = [DateTimeOffset]::UtcNow.ToString('O')
              Get-CimInstance -Query $query -ErrorAction Stop | ForEach-Object {
                [pscustomobject]@{
                  At = $at; ProcessId = $_.IDProcess; Name = $_.Name; StartTimestamp = $_.ElapsedTime
                  CpuMilliseconds = $_.PercentProcessorTime / 10000; KernelCpuMilliseconds = $_.PercentPrivilegedTime / 10000
                  ReadBytes = $_.IOReadBytesPerSec; WriteBytes = $_.IOWriteBytesPerSec
                }
              } | Export-Csv -LiteralPath $path -NoTypeInformation -Append
              Start-Sleep -Seconds 5
            }
          }
          try {
            $filter = 'Category=Performance'
            if (-not [string]::IsNullOrWhiteSpace($env:PERFORMANCE_TEST_FILTER)) {
              $filter += "&($env:PERFORMANCE_TEST_FILTER)"
            }
            $matchedTests = 0
            foreach ($suite in @('Unit', 'Client', 'Integration')) {
              $results = "artifacts/TestResults/performance-$suite"
              dotnet test "tests/ReArtWord.Contents.BackgroundService.$suite.Tests" -c Release --no-build --no-restore --filter $filter --settings eng/testing/ci.runsettings --logger 'trx;LogFileName=performance.trx' --logger 'console;verbosity=normal' --results-directory $results -- xUnit.ParallelizeTestCollections=false RunConfiguration.TreatNoTestsAsError=false
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              [xml]$report = Get-Content -LiteralPath (Join-Path $results 'performance.trx') -Raw
              $matchedTests += [int]$report.TestRun.ResultSummary.Counters.total
            }
            if ($matchedTests -eq 0) { throw 'No performance tests matched the selected filter.' }
          } finally {
            Stop-Job -Job $monitor, $processMonitor
            Receive-Job -Job $monitor, $processMonitor -ErrorAction Continue
            Remove-Job -Job $monitor, $processMonitor
          }
      - name: Summarize validation results
        id: validation_summary
        if: always()
        env:
          VALIDATION_STEPS: ${{ toJSON(steps) }}
        run: node .github/scripts/validation.mjs
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          overwrite: true
          path: |
            artifacts/TestResults/**
            .work/integration/**/startup-error.txt
            .work/integration/**/startup-failure.json
            .work/integration/**/state/logs/**/*.jsonl
            .work/integration/**/random-restarts.json
            .work/integration/**/audio-workload.json
            .work/integration/**/heartbeat-timing.json
            .work/integration/**/latency.json
            .work/integration/**/*-measurement.json
            .work/performance/**/*.json
            .work/workflow-latency/**/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail manual validation when tests fail
        if: >-
          !cancelled() && github.event_name == 'workflow_dispatch' && inputs.skip_package &&
          steps.validation_summary.outputs.tests_failed == 'true'
        run: throw 'Validation stages failed. See the test results summary.'

  package:
    name: Package and installation tests (8 vCPU)
    needs: tests
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_package
    runs-on: ${{ vars.RELEASE_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 210
    outputs:
      tests_failed: ${{ steps.validation_summary.outputs.tests_failed }}
      test_results: ${{ steps.validation_summary.outputs.test_results }}
    env:
      ContinuousIntegrationBuild: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
      PACKAGE_RUNTIME_VERSION: '10.0.13'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Prepare Windows build tools
        uses: ./.github/actions/prepare-windows
      - name: Build the installation test host
        run: |
          dotnet restore Clutch-CS.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/ReArtWord.Contents.BackgroundService.Installer.Tests/ReArtWord.Contents.BackgroundService.Installer.Tests.csproj -c Release --no-restore -warnaserror "-p:Version=$env:RELEASE_VERSION"
      - name: Ensure the publishing runtime
        run: |
          $required = [version]$env:PACKAGE_RUNTIME_VERSION
          function Test-PublishingRuntime {
            $runtimes = dotnet --list-runtimes
            if ($LASTEXITCODE -ne 0) { throw 'Could not list installed .NET runtimes.' }
            foreach ($runtime in $runtimes) {
              if ($runtime -match '^Microsoft\.NETCore\.App (\d+\.\d+\.\d+) \[') {
                $version = [version]$Matches[1]
                if ($version.Major -eq $required.Major -and $version.Minor -eq $required.Minor -and $version -ge $required) { return $true }
              }
            }
            return $false
          }
          if (-not (Test-PublishingRuntime)) {
            $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install-publishing.ps1'
            $dotnetRoot = Split-Path (Get-Command dotnet -CommandType Application).Source
            Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer
            & pwsh -NoProfile -File $installer -Runtime dotnet -Version $env:PACKAGE_RUNTIME_VERSION -Architecture x64 -InstallDir $dotnetRoot -SkipNonVersionedFiles -NoPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the .NET runtime required by the publishing tools.' }
          }
          if (-not (Test-PublishingRuntime)) { throw 'The .NET runtime required by the publishing tools is unavailable.' }
          dotnet --list-runtimes
      - name: Build the bundled Windows installer
        run: |
          ./installer/New-InstallPackage.ps1 -OutputRoot (Join-Path $PWD 'artifacts/package') -ReleaseId $env:RELEASE_TAG -Version $env:RELEASE_VERSION -RuntimeIdentifier win-x64 -RuntimeVersion $env:PACKAGE_RUNTIME_VERSION
      - name: Test install, update, repair and uninstall in an isolated cluster
        id: install_tests
        continue-on-error: true
        run: |
          $env:CLUTCH_TEST_PACKAGE = Join-Path $PWD 'artifacts/package/files'
          # 試験本体の30分を先に満了させ、取消後の後処理に5分の猶予を設けます。
          dotnet test tests/ReArtWord.Contents.BackgroundService.Installer.Tests/ReArtWord.Contents.BackgroundService.Installer.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~RealInstallationTests|FullyQualifiedName~RealWebClientTests|FullyQualifiedName~RealWebClientUpdateTests' --settings eng/testing/ci.runsettings --blame-hang-timeout 35m --blame-hang-dump-type mini --logger trx --logger 'console;verbosity=normal' --results-directory artifacts/InstallTestResults -- RunConfiguration.TreatNoTestsAsError=true
      - name: Summarize installation coverage
        if: always() && steps.install_tests.outcome != 'skipped' && steps.install_tests.outcome != ''
        run: |
          $results = @(Get-ChildItem artifacts/InstallTestResults -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$report = Get-Content -LiteralPath $_.FullName -Raw
            $report.TestRun.Results.UnitTestResult
          })
          $summary = @('### Installation coverage', '', '| Test | Result | Detail |', '| --- | --- | --- |')
          foreach ($result in $results | Sort-Object testName) {
            $icon = switch ($result.outcome) { 'Passed' { '✅' } 'Failed' { '❌' } 'NotExecuted' { '➖' } default { '❔' } }
            $name = [Net.WebUtility]::HtmlEncode([string]$result.testName).Replace('|', '&#124;')
            $detail = [Net.WebUtility]::HtmlEncode([string]$result.Output.ErrorInfo.Message).Replace('|', '&#124;') -replace '\r?\n', '<br>'
            $summary += "| $name | $icon | $detail |"
          }
          if ($results.Count -eq 0) { $summary += '| No test results were produced | ❔ | Installation coverage is unconfirmed. |' }
          if (@($results | Where-Object outcome -eq 'NotExecuted').Count -gt 0) {
            $summary += @('', '➖: Not verified in this environment. See the reasons above.')
          }
          ($summary -join "`n") + "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Verify installation without AVX2 in isolated processes
        id: avx2_tests
        continue-on-error: true
        env:
          DOTNET_EnableAVX2: '0'
        run: |
          ./tests/ReArtWord.Contents.BackgroundService.Unit.Tests/Updates/Test-InstallFlow.ps1 -InstallerPath (Join-Path $PWD 'installer/Install-Offline.ps1') -CoreExecutablePath (Join-Path $PWD 'artifacts/package/files/core/Clutch-CS.CoreService.exe') -VerifierExecutablePath (Join-Path $PWD 'artifacts/package/files/updater/ReArtWord.Contents.BackgroundService.Updater.exe') -RequireAvx2Disabled
      - name: Archive installer and corresponding source
        run: |
          $directory = Join-Path $PWD 'artifacts/release'
          [void][IO.Directory]::CreateDirectory($directory)
          $name = "Clutch-CS-Setup-$($env:RELEASE_TAG)-win-x64.zip"
          $archive = Join-Path $directory $name
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'artifacts/package'), $archive, [IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          [IO.File]::WriteAllText($archive + '.sha256', "$hash  $name`n")
          ./tests/ReArtWord.Contents.BackgroundService.Installer.Tests/Test-SetupPackage.ps1 -ArchivePath $archive
          ./installer/New-SourcePackage.ps1 -OutputDirectory $directory -ReleaseId $env:RELEASE_TAG -Revision $env:RELEASE_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'validation-windows' || 'release-windows' }}
          path: artifacts/release/*
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Summarize validation results
        id: validation_summary
        if: always()
        env:
          VALIDATION_STEPS: ${{ toJSON(steps) }}
          PREVIOUS_VALIDATION_RESULTS: ${{ needs.tests.outputs.test_results }}
        run: node .github/scripts/validation.mjs
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installation-test-results
          overwrite: true
          path: |
            artifacts/InstallTestResults/**
            .work/integration/**/startup-error.txt
            .work/integration/**/startup-failure.json
            .work/integration/**/state/logs/**/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail manual validation when tests fail
        if: >-
          !cancelled() && github.event_name == 'workflow_dispatch' &&
          steps.validation_summary.outputs.tests_failed == 'true'
        run: throw 'Validation stages failed. See the test results summary.'
